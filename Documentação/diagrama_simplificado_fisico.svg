<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow-s" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <linearGradient id="headerGradS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="lokiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="stGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ollamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="chromaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Marcadores de Setas -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea" />
    </marker>
  </defs>

  <!-- Container Principal (Ambiente Físico) -->
  <rect x="15" y="15" width="1250" height="590" rx="16" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow-s)" />
  
  <!-- Tag Superior Esquerda: "Ambiente Físico" -->
  <rect x="15" y="15" width="180" height="34" rx="14" fill="#0284c7" />
  <rect x="15" y="32" width="180" height="17" fill="#0284c7" />
  <text x="35" y="37" fill="#ffffff" font-size="13" font-weight="700">AMBIENTE FÍSICO</text>
  <text x="210" y="37" fill="#64748b" font-size="12" font-weight="600">Arquitetura Simplificada: Hardware de Borda, Observabilidade e RAG Local</text>

  <!-- ======================================================= -->
  <!-- 1. ATACANTE / BOTNET IOT -->
  <!-- ======================================================= -->
  <rect x="40" y="240" width="115" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="97" cy="285" r="26" fill="#fee2e2" stroke="#f87171" stroke-width="1.5" />
  <text x="97" y="294" fill="#dc2626" font-size="24" text-anchor="middle">👤</text>
  <text x="97" y="335" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Atacante /</text>
  <text x="97" y="352" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Botnet IoT</text>
  <text x="97" y="375" fill="#dc2626" font-size="11" font-weight="bold" text-anchor="middle">Porta 22 SSH</text>

  <!-- ======================================================= -->
  <!-- 2. CONTAINER RASPBERRY PI (EDGE) -->
  <!-- ======================================================= -->
  <rect x="195" y="160" width="200" height="310" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2" />
  
  <!-- Header Raspberry -->
  <rect x="195" y="160" width="200" height="36" rx="14" fill="#f1f5f9" />
  <rect x="195" y="182" width="200" height="14" fill="#f1f5f9" />
  <text x="295" y="184" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">🍓 Raspberry Pi 4</text>

  <!-- Sub-bloco Cowrie Honeypot -->
  <rect x="210" y="210" width="170" height="105" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" />
  <text x="295" y="235" fill="#9f1239" font-size="13" font-weight="bold" text-anchor="middle">🍯 Cowrie Honeypot</text>
  <text x="295" y="252" fill="#e11d48" font-size="11" font-weight="bold" text-anchor="middle">Porta 2222 (Docker)</text>
  <text x="295" y="274" fill="#475569" font-size="10" text-anchor="middle">Emulação SSH &amp; Telnet</text>
  <text x="295" y="292" fill="#64748b" font-size="10" text-anchor="middle">Gera <tspan font-family="monospace">cowrie.json</tspan></text>

  <!-- Sub-bloco Promtail (NO LUGAR CERTO, DENTRO DO PI!) -->
  <rect x="210" y="340" width="170" height="105" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="295" y="365" fill="#9a3412" font-size="13" font-weight="bold" text-anchor="middle">📦 Promtail (Edge)</text>
  <text x="295" y="382" fill="#c2410c" font-size="11" font-weight="bold" text-anchor="middle">Agente de Coleta</text>
  <text x="295" y="404" fill="#475569" font-size="10" text-anchor="middle">Lê logs do Honeypot</text>
  <text x="295" y="422" fill="#0d9488" font-size="10" font-weight="bold" text-anchor="middle">Envia via Tailscale VPN</text>

  <!-- Seta Interna: Cowrie -> Promtail -->
  <path d="M 295 315 L 295 340" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)" />

  <!-- ======================================================= -->
  <!-- 3. LOKI & GRAFANA -->
  <!-- ======================================================= -->
  <!-- Loki -->
  <rect x="440" y="355" width="105" height="110" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
  <circle cx="492" cy="392" r="20" fill="url(#lokiGrad)" />
  <text x="492" y="399" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">L</text>
  <text x="492" y="430" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Loki</text>
  <text x="492" y="448" fill="#c2410c" font-size="11" font-weight="bold" text-anchor="middle">:3100</text>

  <!-- Grafana -->
  <rect x="585" y="355" width="115" height="110" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="642" cy="392" r="20" fill="url(#grafanaGrad)" />
  <text x="642" y="399" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">G</text>
  <text x="642" y="430" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Grafana</text>
  <text x="642" y="448" fill="#b45309" font-size="11" font-weight="bold" text-anchor="middle">:3000</text>

  <!-- Documento / Alerta Regra -->
  <rect x="735" y="365" width="110" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="790" y="395" fill="#dc2626" font-size="22" text-anchor="middle">⚠️</text>
  <text x="790" y="420" fill="#991b1b" font-size="12" font-weight="bold" text-anchor="middle">Alerta (Regra)</text>
  <text x="790" y="438" fill="#64748b" font-size="10" text-anchor="middle">Pending: 0s</text>

  <!-- ======================================================= -->
  <!-- 4. FRONTEND STREAMLIT & USUÁRIO (PARTE SUPERIOR) -->
  <!-- ======================================================= -->
  <!-- Frontend Streamlit -->
  <rect x="560" y="80" width="180" height="120" rx="12" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
  <circle cx="650" cy="115" r="18" fill="url(#stGrad)" />
  <text x="650" y="122" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">S</text>
  <text x="650" y="150" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Frontend Streamlit</text>
  <text x="650" y="168" fill="#be123c" font-size="11" font-weight="bold" text-anchor="middle">(Porta 8501)</text>
  <text x="650" y="186" fill="#64748b" font-size="10" text-anchor="middle">Feed Tático &amp; RAG Chat</text>

  <!-- Analista / Usuário -->
  <rect x="785" y="85" width="130" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3" />
  <text x="850" y="120" fill="#334155" font-size="24" text-anchor="middle">👤💬</text>
  <text x="850" y="145" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Analista SOC</text>
  <text x="850" y="163" fill="#64748b" font-size="11" text-anchor="middle">Pergunta (Chat)</text>
  <text x="850" y="179" fill="#0284c7" font-size="10" font-weight="bold" text-anchor="middle">&amp; Análise Forense</text>

  <!-- ======================================================= -->
  <!-- 5. BACKEND API (FASTAPI) -->
  <!-- ======================================================= -->
  <rect x="915" y="275" width="130" height="150" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <circle cx="980" cy="315" r="22" fill="url(#apiGrad)" />
  <text x="980" y="323" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">API</text>
  <text x="980" y="355" fill="#0f172a" font-size="15" font-weight="bold" text-anchor="middle">FastAPI</text>
  <text x="980" y="373" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">:5000 (alerts-api)</text>
  <text x="980" y="395" fill="#64748b" font-size="10" text-anchor="middle">Orquestrador &amp;</text>
  <text x="980" y="410" fill="#64748b" font-size="10" text-anchor="middle">GeoIP Engine</text>

  <!-- ======================================================= -->
  <!-- 6. SERVIÇOS CONECTADOS À API: CHROMA, TELEGRAM, LLM -->
  <!-- ======================================================= -->
  <!-- ChromaDB (Abaixo da API) -->
  <rect x="915" y="475" width="130" height="95" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" />
  <circle cx="980" cy="505" r="16" fill="url(#chromaGrad)" />
  <text x="980" y="511" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">C</text>
  <text x="980" y="535" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">ChromaDB</text>
  <text x="980" y="553" fill="#7e22ce" font-size="11" font-weight="bold" text-anchor="middle">:8000 (RAG Store)</text>

  <!-- Telegram (Direita Superior da API) -->
  <rect x="1115" y="235" width="125" height="105" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" />
  <circle cx="1177" cy="270" r="18" fill="url(#tgGrad)" />
  <text x="1177" y="276" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">✈️</text>
  <text x="1177" y="305" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Telegram</text>
  <text x="1177" y="323" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">Alertas Push</text>

  <!-- LLM Local Ollama (Direita Inferior da API) -->
  <rect x="1115" y="385" width="125" height="115" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
  <circle cx="1177" cy="420" r="18" fill="url(#ollamaGrad)" />
  <text x="1177" y="426" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">🦙</text>
  <text x="1177" y="455" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">LLM Local</text>
  <text x="1177" y="473" fill="#4338ca" font-size="11" font-weight="bold" text-anchor="middle">Ollama (:11434)</text>
  <text x="1177" y="488" fill="#64748b" font-size="10" text-anchor="middle">Llama 3.2 Offline</text>

  <!-- ======================================================= -->
  <!-- SETAS E CONEXÕES DO FLUXO -->
  <!-- ======================================================= -->
  
  <!-- 1. Atacante -> Raspberry Pi (Cowrie) -->
  <path d="M 155 315 L 210 270" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="180" y="280" fill="#dc2626" font-size="10" font-weight="bold">Porta 22</text>

  <!-- 2. Promtail -> Loki (Com Indicação de Tailscale VPN!) -->
  <path d="M 380 405 L 440 405" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr-gray)" />
  <rect x="382" y="375" width="55" height="18" rx="4" fill="#ccfbf1" stroke="#14b8a6" />
  <text x="410" y="388" fill="#0f766e" font-size="9" font-weight="bold" text-anchor="middle">VPN</text>

  <!-- 3. Loki -> Grafana -->
  <path d="M 545 410 L 585 410" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)" />
  <text x="565" y="400" fill="#c2410c" font-size="10" font-weight="bold" text-anchor="middle">Logs</text>

  <!-- 4. Grafana -> Alerta Regra -->
  <path d="M 700 410 L 735 410" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- 5. Alerta Regra -> Webhook -> API -->
  <path d="M 845 410 L 880 410 L 880 350 L 915 350" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="850" y="370" width="56" height="18" rx="4" fill="#e0f2fe" stroke="#bae6fd" />
  <text x="878" y="383" fill="#0369a1" font-size="9" font-weight="bold" text-anchor="middle">Webhook</text>

  <!-- 6. Grafana -> Streamlit (Iframe/Métricas) -->
  <path d="M 642 355 L 642 200" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4" marker-end="url(#arr-gray)" />
  <text x="648" y="275" fill="#b45309" font-size="10" font-weight="bold">Iframe Logs</text>

  <!-- 7. Analista <-> Streamlit -->
  <path d="M 785 140 L 740 140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />
  <path d="M 740 150 L 785 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- 8. Streamlit <-> API (REST: /alerts, /chat, /iocs) -->
  <path d="M 740 110 L 980 110 L 980 275" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arr-red)" />
  <path d="M 970 275 L 970 120 L 740 120" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="830" y="100" width="85" height="20" rx="4" fill="#fee2e2" stroke="#fca5a5" />
  <text x="872" y="114" fill="#991b1b" font-size="10" font-weight="bold" text-anchor="middle">REST /alerts /chat</text>

  <!-- 9. API <-> ChromaDB (Embeddings / Contexto) -->
  <path d="M 965 425 L 965 475" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)" />
  <path d="M 995 475 L 995 425" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)" />
  <text x="1035" y="455" fill="#7e22ce" font-size="10" font-weight="bold">Embeddings</text>

  <!-- 10. API -> Telegram (Alertas) -->
  <path d="M 1045 320 L 1115 285" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="1075" y="295" fill="#0284c7" font-size="10" font-weight="bold">Alertas</text>

  <!-- 11. API <-> LLM (Análise / RAG) -->
  <path d="M 1045 385 L 1115 425" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-gray)" />
  <path d="M 1115 440 L 1045 400" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="1075" y="425" fill="#4338ca" font-size="10" font-weight="bold">Inferência</text>

</svg>