services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie-honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./cowrie/var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
    networks:
      - tcc-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tcc-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      # Mapeando o log do Cowrie para o Promtail conseguir ler
      - ./cowrie/var/log/cowrie:/var/log/cowrie
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tcc-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - tcc-network
    depends_on:
      - loki
  alerts-api:
    build: ./alerts-api
    container_name: alerts-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - tcc-network
    env_file:
      - .env  # O Docker vai injetar essas variáveis direto no container
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - tcc-network

volumes:
  ollama_data:

networks:
  tcc-network:
    driver: bridge